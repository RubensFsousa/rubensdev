<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Rubens Dev</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@700&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #f5f6f8; --ink: #141c2b; --muted: #586174; --accent: #f0b429; }
@media (prefers-color-scheme: dark) { :root { --bg: #10151d; --ink: #e9edf4; --muted: #9aa4b6; --accent: #f5c04a; color-scheme: dark } }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.05rem/1.6 "Instrument Sans", system-ui, sans-serif;
  display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
main { max-width: 34rem; display: flex; flex-direction: column; gap: 16px; }
h1 { font: 700 clamp(2rem, 7vw, 3rem)/1.05 "Familjen Grotesk", system-ui, sans-serif; margin: 0; }
p { margin: 0; color: var(--muted); }
a { align-self: start; background: var(--accent); color: #1d1503; font-weight: 600; text-decoration: none; padding: 12px 20px; border-radius: 999px; }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p>Erro 404</p>
  <h1>Essa página não existe.</h1>
  <p>O endereço pode ter mudado ou ter sido digitado errado.</p>
  <a href="/">Voltar para o início</a>
</main>
</body>
</html>
